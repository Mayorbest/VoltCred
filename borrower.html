<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VoltCred | Vendor Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
    <div class="borrower-wrapper">
        
        <div class="col-left">
            <div class="card">
                <div class="profile-header">
                    <img id="profile-img" src="https://i.pravatar.cc/150?img=47" alt="Profile" class="profile-img">
                    <div>
                        <h2 id="business-name" style="margin: 0;">Loading...</h2>
                        <p id="owner-name" style="margin: 0; color: var(--text-muted);">Owner Name</p>
                    </div>
                </div>
                <hr style="border-color: #1e293b; margin: 1rem 0;">
                
                <div class="icon-text">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span id="business-location">Loading location...</span>
                </div>
                <div class="icon-text">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <span id="business-phone">Loading phone...</span>
                </div>
                <div class="icon-text">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span id="home-address">Loading address...</span>
                </div>
            </div>

            <div class="card" style="text-align: center;">
                <h3 style="margin-top: 0; border: none;">Current Trust Standing</h3>
                <div id="trust-indicator">Capital Unlocked</div>
            </div>
        </div>

        <div class="col-right">
            <div class="card" id="repayment-card">
                 <h3 style="margin-top: 0;">Active Loan Status</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Total Loan:</span><strong id="borrower-total-loan">₦0</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                    <span>Amount Paid:</span><strong id="borrower-amount-paid" style="color: var(--trust-green);">₦0</strong>
                </div>
                <div style="background: #020617; padding: 1.5rem; border-radius: 12px; text-align: center; border: 1px solid #1e293b;">
                    <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">Today's Installment Due</p>
                    <h2 id="borrower-daily-due" style="margin: 0.5rem 0 1rem 0; font-size: 2rem;">₦2,500</h2>
                    <button id="btn-mock-pay" class="btn-outline" style="width: 100%;">Simulate Payment via Squad</button>
                </div>
            </div>

            <div class="card" style="display: flex; align-items: center; justify-content: center;">
                <button id="btn-request-loan" class="btn-squad">Request Working Capital</button>
            </div>
        </div>

    </div>
    <script src="task.js" type="module"></script>
</body>
</html>
